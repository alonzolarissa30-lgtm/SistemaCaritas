<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear administrador</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 380px; margin: 40px auto; padding: 0 12px; }
    h1 { color: #7b3f00; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Crear administrador</h1>
  <p>Es la primera vez que se usa el sistema. Crea la cuenta del administrador (el dueño).</p>
  {% include "mensajes.html" %}
  <form method="post">
    <input type="text" name="usuario" placeholder="Usuario" required autofocus>
    <input type="password" name="clave" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password" required>
    <input type="password" name="confirmar" placeholder="Repite la contraseña" autocomplete="new-password" required>
    <button type="submit">Crear administrador</button>
  </form>
</body>
</html>
