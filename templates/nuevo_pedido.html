<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo pedido</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 12px; }
    h1 { color: #7b3f00; }
    .linea { display: flex; justify-content: space-between; align-items: center;
             padding: 10px 0; border-bottom: 1px solid #ddd; gap: 8px; }
    .linea input { width: 80px; padding: 8px; font-size: 18px; text-align: center; }
    .total { font-size: 22px; font-weight: bold; margin: 16px 0; }
    button { padding: 12px 18px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  {% include "menu.html" %}
  <h1>Nuevo pedido</h1>
  {% include "mensajes.html" %}

  <form action="{{ url_for('guardar_pedido') }}" method="post">
    {% for p in productos %}
      <div class="linea">
        <div>
          <strong>{{ p.nombre }}</strong><br>
          Q{{ '%.2f'|format(p.precio) }}
        </div>
        <input type="number" name="cantidad_{{ p.id }}" value="0" min="0" step="1"
               inputmode="numeric" data-precio="{{ p.precio }}" class="cant">
      </div>
    {% else %}
      <p>No hay productos activos. El administrador debe agregarlos en la pantalla de Productos.</p>
    {% endfor %}

    <div class="total">Total: Q<span id="total">0.00</span></div>
    <button type="submit">Guardar pedido</button>
  </form>

  <script>
    const campos = document.querySelectorAll(".cant");
    function calcular() {
      let total = 0;
      campos.forEach(c => {
        total += (parseInt(c.value) || 0) * parseFloat(c.dataset.precio);
      });
      document.getElementById("total").textContent = total.toFixed(2);
    }
    campos.forEach(c => c.addEventListener("input", calcular));
  </script>
</body>
</html>
